<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — MVillacar</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/icon-192.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img src="assets/img/logo.webp" alt="MVillacar" class="brand-logo">
    </a>
  </div>
</header>

<section class="section-tight">
  <div class="wrap" style="max-width:420px;">
    <div class="section-head center">
      <p class="kicker">Acceso interno</p>
      <h2>Iniciar sesión</h2>
      <p>Para administradores y asesores. Si eres visitante, no necesitas una cuenta para navegar el sitio.</p>
    </div>
    <div class="form-card">
      <form id="login-form">
        <div class="form-grid">
          <div class="full"><label for="l-email">Correo</label><input id="l-email" type="email" required autocomplete="username"></div>
          <div class="full">
            <label for="l-password">Contraseña</label>
            <div class="password-field">
              <input id="l-password" type="password" required autocomplete="current-password">
              <button type="button" class="password-toggle" id="l-password-toggle" aria-label="Mostrar contraseña" aria-pressed="false">
                <svg class="icon-show" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-hide" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
          </div>
        </div>
        <p id="login-error" class="form-note" style="color:var(--red);display:none;"></p>
        <button type="submit" id="login-submit" class="btn btn-primary btn-block" style="margin-top:22px;">Entrar</button>
      </form>
    </div>
  </div>
</section>

<footer class="site">
  <div class="wrap">
    <div class="footer-bottom">
      <p>© <span data-year></span> MVillacar</p>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/main.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async function(){
    /* Si ya hay sesión, ir directo al panel */
    const profile = await getCurrentProfile();
    if(profile){ window.location.href = "panel.html"; return; }

    /* Ojito: muestra u oculta la contraseña mientras se escribe */
    const pwInput = document.getElementById("l-password");
    const pwToggle = document.getElementById("l-password-toggle");
    pwToggle.addEventListener("click", function(){
      const show = pwInput.type === "password";
      pwInput.type = show ? "text" : "password";
      pwToggle.setAttribute("aria-pressed", show ? "true" : "false");
      pwToggle.setAttribute("aria-label", show ? "Ocultar contraseña" : "Mostrar contraseña");
      pwToggle.querySelector(".icon-show").hidden = show;
      pwToggle.querySelector(".icon-hide").hidden = !show;
      pwInput.focus();
    });

    const form = document.getElementById("login-form");
    const submitBtn = document.getElementById("login-submit");
    const errorEl = document.getElementById("login-error");

    form.addEventListener("submit", async function(e){
      e.preventDefault();
      errorEl.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Entrando...";

      const email = document.getElementById("l-email").value;
      const password = document.getElementById("l-password").value;
      const { error } = await signIn(email, password);

      if(error){
        errorEl.textContent = "Correo o contraseña incorrectos.";
        errorEl.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Entrar";
        return;
      }

      const loggedProfile = await getCurrentProfile();
      if(!loggedProfile){
        errorEl.textContent = "Tu cuenta no tiene un rol asignado. Contacta al administrador.";
        errorEl.style.display = "block";
        await signOut();
        submitBtn.disabled = false;
        submitBtn.textContent = "Entrar";
        return;
      }

      window.location.href = "panel.html";
    });
  });
</script>
</body>
</html>
